# 예시 전용: kustomization.yaml에 포함하지 않는다.
# 실제 값을 채운 파일은 Git에 저장하지 말고 승인된 Secret 관리 경로로 적용한다.
apiVersion: v1
kind: Secret
metadata:
  name: lumos-lab-backend-secret
  namespace: lumos-lab-dev
type: Opaque
stringData:
  LUMOS_LAB_DB_URL: "jdbc:mariadb://your-lumos-db-host:3306/LUMOS_LAB?connectTimeout=5000&socketTimeout=30000"
  LUMOS_LAB_DB_USERNAME: "replace-with-database-user"
  LUMOS_LAB_DB_PASSWORD: "replace-with-database-password"
  LUMOS_LAB_JWT_SECRET: "replace-with-a-random-secret"
