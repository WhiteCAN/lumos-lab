spring.application.name=lumos-lab-backend
spring.datasource.url=jdbc:h2:mem:lumoslab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
app.security.jwt-secret=${LUMOS_LAB_JWT_SECRET:lumos-lab-local-only-secret-change-me}
grpc.server.port=9090
grpc.client.host=localhost
grpc.client.port=9090
