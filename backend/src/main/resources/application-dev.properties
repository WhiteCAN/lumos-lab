spring.datasource.url=${LUMOS_LAB_DB_URL}
spring.datasource.username=${LUMOS_LAB_DB_USERNAME}
spring.datasource.password=${LUMOS_LAB_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.catalog=LUMOS_LAB
spring.datasource.hikari.maximum-pool-size=${LUMOS_LAB_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
# 기존 Lumos MariaDB 10.3 호환. DB 업그레이드 후 기본 dialect 전환 검토.
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
spring.jpa.properties.hibernate.default_catalog=LUMOS_LAB
# 스키마 변경은 검토한 SQL로 수행하고 앱 시작 시에는 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://lab.dev.lumosgraphy.com}
# 같은 Pod 안의 gRPC 서버를 호출한다. 외부 Ingress로 노출하지 않는다.
grpc.server.port=${GRPC_SERVER_PORT:9090}
grpc.client.host=${GRPC_CLIENT_HOST:127.0.0.1}
grpc.client.port=${GRPC_CLIENT_PORT:9090}
