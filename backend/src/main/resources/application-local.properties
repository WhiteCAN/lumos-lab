spring.datasource.url=jdbc:h2:mem:lumoslab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
app.security.jwt-secret=${LUMOS_LAB_JWT_SECRET:lumos-lab-local-only-secret-change-me}
grpc.server.port=${GRPC_SERVER_PORT:9090}
grpc.client.host=${GRPC_CLIENT_HOST:localhost}
grpc.client.port=${GRPC_CLIENT_PORT:9090}
