apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumos-lab-frontend-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: lumos-lab-frontend=ghcr.io/whitecan/lumos-lab-frontend
    argocd-image-updater.argoproj.io/lumos-lab-frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/lumos-lab-frontend.allow-tags: regexp:^[0-9a-f]{7,40}$
    argocd-image-updater.argoproj.io/lumos-lab-frontend.pull-secret: pullsecret:argocd/ghcr-secret
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: lumos-lab
  source:
    repoURL: https://github.com/WhiteCAN/lumos-lab.git
    targetRevision: development
    path: frontend/k8s/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: lumos-lab-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
